<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430" role="img" aria-labelledby="title desc">
  <title id="title">Threadmark preserves recent context across new agent sessions</title>
  <desc id="desc">A five-panel comic showing an AI robot losing context after a new session, then using Threadmark to preserve just enough recent context to understand vague follow-ups.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .panel { fill: #ffffff; stroke: #263238; stroke-width: 3; rx: 18; }
      .label { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #263238; }
      .small { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #263238; }
      .tiny { font: 600 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #263238; }
      .caption { font: 700 22px Inter, ui-sans-serif, system-ui, sans-serif; fill: #263238; }
      .bubble { fill: #ffffff; stroke: #263238; stroke-width: 2; }
      .door { fill: #d7ecff; stroke: #2f6f9f; stroke-width: 3; }
      .desk { fill: #c9a36a; stroke: #7a5630; stroke-width: 2; }
      .note1 { fill: #fff3a3; stroke: #c8a93a; stroke-width: 1.5; }
      .note2 { fill: #c8f7dc; stroke: #62a878; stroke-width: 1.5; }
      .note3 { fill: #ffd6d6; stroke: #c97c7c; stroke-width: 1.5; }
      .note4 { fill: #d8d5ff; stroke: #8b86c9; stroke-width: 1.5; }
      .robot { fill: #dfe9f3; stroke: #263238; stroke-width: 2.5; }
      .screen { fill: #7be0d6; stroke: #263238; stroke-width: 2; }
      .user { fill: #6ca6ff; stroke: #263238; stroke-width: 2; }
      .skin { fill: #ffd3b6; stroke: #263238; stroke-width: 2; }
      .bird { fill: #ffcb5b; stroke: #263238; stroke-width: 2; }
      .envelope { fill: #fff6d7; stroke: #263238; stroke-width: 2; }
      .muted { fill: #607d8b; }
      .wind { fill: none; stroke: #7aa7c7; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="bg" width="1500" height="430" />

  <g transform="translate(20 20)">
    <rect class="panel" width="276" height="330" />
    <text class="label" x="16" y="30">Panel 1</text>
    <text class="small" x="92" y="30">Start a new session</text>

    <circle class="skin" cx="55" cy="105" r="24" />
    <rect class="user" x="35" y="130" width="42" height="70" rx="14" />
    <line x1="76" y1="148" x2="108" y2="132" stroke="#263238" stroke-width="4" stroke-linecap="round" />
    <text class="tiny" x="25" y="222">User</text>

    <rect class="desk" x="95" y="205" width="150" height="28" rx="6" />
    <line x1="112" y1="233" x2="100" y2="292" stroke="#7a5630" stroke-width="5" />
    <line x1="228" y1="233" x2="242" y2="292" stroke="#7a5630" stroke-width="5" />

    <rect class="robot" x="150" y="118" width="66" height="78" rx="14" />
    <rect class="screen" x="162" y="133" width="42" height="28" rx="8" />
    <circle cx="176" cy="147" r="3" fill="#263238" />
    <circle cx="191" cy="147" r="3" fill="#263238" />
    <line x1="183" y1="119" x2="183" y2="104" stroke="#263238" stroke-width="3" />
    <circle cx="183" cy="100" r="5" fill="#ff6b6b" stroke="#263238" stroke-width="2" />
    <line x1="150" y1="165" x2="125" y2="153" stroke="#263238" stroke-width="4" stroke-linecap="round" />
    <line x1="216" y1="165" x2="239" y2="153" stroke="#263238" stroke-width="4" stroke-linecap="round" />
    <text class="tiny" x="155" y="222">AI robot</text>

    <rect class="note1" x="104" y="66" width="82" height="30" rx="5" transform="rotate(-7 145 81)" />
    <text class="tiny" x="112" y="84" transform="rotate(-7 145 81)">city weather</text>
    <rect class="note2" x="176" y="64" width="78" height="30" rx="5" transform="rotate(5 215 79)" />
    <text class="tiny" x="184" y="82" transform="rotate(5 215 79)">validation</text>
    <rect class="note3" x="88" y="103" width="77" height="30" rx="5" transform="rotate(6 126 118)" />
    <text class="tiny" x="96" y="121" transform="rotate(6 126 118)">gateway</text>
    <rect class="note4" x="204" y="99" width="62" height="30" rx="5" transform="rotate(-6 235 114)" />
    <text class="tiny" x="211" y="117" transform="rotate(-6 235 114)">no systemd</text>
  </g>

  <g transform="translate(312 20)">
    <rect class="panel" width="276" height="330" />
    <text class="label" x="16" y="30">Panel 2</text>
    <text class="small" x="92" y="30">Context blows away</text>

    <rect class="door" x="154" y="75" width="82" height="170" rx="8" />
    <text class="label" x="173" y="105">/new</text>
    <path d="M182 245 L182 126 L231 92 L231 245 Z" fill="#b9dcf5" opacity="0.9" />

    <rect class="robot" x="94" y="152" width="62" height="74" rx="14" />
    <rect class="screen" x="105" y="166" width="40" height="26" rx="8" />
    <circle cx="118" cy="179" r="3" fill="#263238" />
    <circle cx="132" cy="179" r="3" fill="#263238" />
    <line x1="155" y1="186" x2="180" y2="174" stroke="#263238" stroke-width="4" stroke-linecap="round" />
    <line x1="108" y1="226" x2="100" y2="258" stroke="#263238" stroke-width="4" />
    <line x1="141" y1="226" x2="157" y2="258" stroke="#263238" stroke-width="4" />

    <path class="wind" d="M32 92 C70 72, 95 111, 136 87" />
    <path class="wind" d="M26 137 C66 117, 111 151, 148 127" />
    <path class="wind" d="M32 183 C69 169, 96 199, 141 178" />

    <rect class="note1" x="42" y="71" width="70" height="28" rx="5" transform="rotate(-18 77 85)" />
    <text class="tiny" x="51" y="89" transform="rotate(-18 77 85)">weather</text>
    <rect class="note2" x="43" y="121" width="76" height="28" rx="5" transform="rotate(13 81 135)" />
    <text class="tiny" x="51" y="139" transform="rotate(13 81 135)">validation</text>
    <rect class="note3" x="44" y="171" width="70" height="28" rx="5" transform="rotate(-10 79 185)" />
    <text class="tiny" x="53" y="189" transform="rotate(-10 79 185)">gateway</text>
  </g>

  <g transform="translate(604 20)">
    <rect class="panel" width="276" height="330" />
    <text class="label" x="16" y="30">Panel 3</text>
    <text class="small" x="92" y="30">Vague follow-up</text>

    <circle class="skin" cx="60" cy="136" r="24" />
    <rect class="user" x="40" y="161" width="42" height="72" rx="14" />
    <path d="M44 126 Q60 112 78 126" fill="none" stroke="#263238" stroke-width="2" />
    <text class="tiny" x="29" y="257">User</text>

    <rect class="bubble" x="26" y="65" width="132" height="42" rx="14" />
    <path d="M80 106 L70 124 L103 106 Z" fill="#fff" stroke="#263238" stroke-width="2" />
    <text class="small" x="39" y="91">Can you do it</text>
    <text class="small" x="66" y="106">again?</text>

    <rect class="robot" x="180" y="150" width="62" height="74" rx="14" />
    <rect class="screen" x="191" y="164" width="40" height="26" rx="8" />
    <circle cx="203" cy="177" r="3" fill="#263238" />
    <circle cx="222" cy="177" r="3" fill="#263238" />
    <path d="M202 187 Q211 181 221 187" fill="none" stroke="#263238" stroke-width="2" />
    <text class="label" x="246" y="155">?</text>

    <rect class="bubble" x="125" y="55" width="130" height="42" rx="14" />
    <path d="M197 96 L207 119 L219 96 Z" fill="#fff" stroke="#263238" stroke-width="2" />
    <text class="small" x="146" y="82">Do what again?</text>

    <rect x="122" y="239" width="86" height="52" rx="8" fill="#cfd8dc" stroke="#263238" stroke-width="2" />
    <path d="M143 239 C143 213, 187 213, 187 239" fill="none" stroke="#263238" stroke-width="5" />
    <text class="tiny" x="132" y="270">Previous</text>
    <text class="tiny" x="134" y="284">context</text>
  </g>

  <g transform="translate(896 20)">
    <rect class="panel" width="276" height="330" />
    <text class="label" x="16" y="30">Panel 4</text>
    <text class="small" x="92" y="30">Threadmark saves a hint</text>

    <path class="bird" d="M81 125 L124 96 L158 124 L125 151 Z" />
    <circle class="bird" cx="151" cy="112" r="22" />
    <polygon points="170,112 199,101 174,126" fill="#ff9f43" stroke="#263238" stroke-width="2" />
    <circle cx="156" cy="106" r="3" fill="#263238" />
    <path d="M99 126 Q67 112 49 139" fill="none" stroke="#263238" stroke-width="4" stroke-linecap="round" />
    <text class="small" x="103" y="177">Threadmark</text>

    <rect class="note1" x="35" y="74" width="72" height="27" rx="5" transform="rotate(-12 71 87)" />
    <text class="tiny" x="44" y="92" transform="rotate(-12 71 87)">weather</text>
    <rect class="note2" x="192" y="72" width="68" height="27" rx="5" transform="rotate(10 226 85)" />
    <text class="tiny" x="200" y="90" transform="rotate(10 226 85)">gateway</text>

    <rect class="envelope" x="64" y="212" width="148" height="78" rx="8" />
    <path d="M64 214 L138 258 L212 214" fill="none" stroke="#263238" stroke-width="2" />
    <text class="small" x="75" y="244">RECENT_CONTEXT.md</text>
    <text class="tiny" x="91" y="272">For vague follow-ups</text>
    <path d="M136 159 C139 179, 139 193, 137 212" fill="none" stroke="#263238" stroke-width="2" stroke-dasharray="5 5" />
  </g>

  <g transform="translate(1188 20)">
    <rect class="panel" width="276" height="330" />
    <text class="label" x="16" y="30">Panel 5</text>
    <text class="small" x="92" y="30">“Again” is grounded</text>

    <rect class="door" x="14" y="88" width="62" height="150" rx="8" />
    <text class="label" x="24" y="116">/new</text>

    <circle class="skin" cx="82" cy="184" r="23" />
    <rect class="user" x="62" y="208" width="42" height="70" rx="14" />
    <path d="M69 179 Q82 194 96 179" fill="none" stroke="#263238" stroke-width="2" />
    <text class="tiny" x="55" y="300">User</text>

    <rect class="bubble" x="18" y="56" width="150" height="43" rx="14" />
    <path d="M84 99 L78 123 L105 99 Z" fill="#fff" stroke="#263238" stroke-width="2" />
    <text class="small" x="31" y="83">Can you do it again?</text>

    <rect class="robot" x="188" y="154" width="62" height="74" rx="14" />
    <rect class="screen" x="199" y="168" width="40" height="26" rx="8" />
    <circle cx="211" cy="181" r="3" fill="#263238" />
    <circle cx="226" cy="181" r="3" fill="#263238" />
    <path d="M210 188 Q218 194 228 188" fill="none" stroke="#263238" stroke-width="2" />
    <line x1="189" y1="196" x2="158" y2="217" stroke="#263238" stroke-width="4" stroke-linecap="round" />

    <rect class="envelope" x="111" y="201" width="86" height="46" rx="6" />
    <path d="M111 202 L154 229 L197 202" fill="none" stroke="#263238" stroke-width="1.5" />
    <text class="tiny" x="117" y="232">RECENT_CONTEXT.md</text>

    <rect class="bubble" x="90" y="78" width="168" height="58" rx="14" />
    <path d="M209 136 L221 158 L233 136 Z" fill="#fff" stroke="#263238" stroke-width="2" />
    <text class="small" x="104" y="103">You mean check</text>
    <text class="small" x="103" y="121">city weather again?</text>
  </g>

  <text class="caption" x="750" y="392" text-anchor="middle">Threadmark preserves just enough recent context so a new agent session knows what “again” means.</text>
</svg>
